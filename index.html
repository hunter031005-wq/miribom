<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미리봄 · 프로그램 참여 장벽 사전 점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#1C2A28; --muted:#5B6C69; --line:#D3DCDA;
  --brand:#1E6B63; --brand-ink:#FFFFFF; --brand-weak:#DDEDEA;
  --hit:#2B7A4B; --hit-weak:#E0F1E6; --miss:#B03838; --miss-weak:#F8E3E3; --hold:#8E6200; --hold-weak:#F7EDD3;
  --ins:#D6F0DE; --del:#F6D9D9; --focus:#2F8CFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1716; --surface:#172221; --sunk:#1D2A28; --ink:#E2EBE9; --muted:#97ABA7; --line:#2C3B39;
  --brand:#5CBFB2; --brand-ink:#0F1716; --brand-weak:#1D3532;
  --hit:#73CF95; --hit-weak:#1C3326; --miss:#F28C8C; --miss-weak:#3A2020; --hold:#E2B652; --hold-weak:#352C15;
  --ins:#1F4A2E; --del:#4E2525; --focus:#6FB0FF;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 8px 2px}
.logo span{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
nav{margin-top:24px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
nav button .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button.on{background:var(--brand-weak);color:var(--ink);font-weight:600}
nav button.on .n{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.side-note{margin:28px 8px 0;font-size:12px;color:var(--muted);line-height:1.6}
main{padding:36px 40px 80px;max-width:1080px;width:100%}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:36px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 24px;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{min-height:110px;resize:vertical;line-height:1.6}
textarea.tall{min-height:260px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.warn{color:var(--miss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.brand{background:var(--brand-weak);border-color:transparent;color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.flow button{border:0;background:none;text-align:left;padding:20px;cursor:pointer;border-right:1px solid var(--line)}
.flow button:last-child{border-right:0}
.flow button:hover{background:var(--brand-weak)}
.flow .k{font-size:34px;font-weight:700;color:var(--brand);line-height:1}
.flow strong{display:block;margin:10px 0 4px;font-size:16px}
.flow span{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--sunk)}
td.c,th.c{text-align:center}
.ok{color:var(--hit);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
pre.doc{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;font:inherit;font-size:14px;max-height:420px;overflow:auto}
.notice{border-left:3px solid var(--hold);background:var(--hold-weak);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
.notice.info{border-color:var(--brand);background:var(--brand-weak)}
.finding{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:var(--surface)}
.finding.j-적중{border-left:4px solid var(--hit)} .finding.j-오탐{border-left:4px solid var(--miss)} .finding.j-보류{border-left:4px solid var(--hold)}
.finding .q{border-left:2px solid var(--line);padding-left:10px;color:var(--muted);font-size:14px;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.적중{background:var(--hit);color:#fff} .seg button.on.오탐{background:var(--miss);color:#fff} .seg button.on.보류{background:var(--hold);color:#fff}
.cell b{font-size:16px} .cell .sub{display:block;font-size:12px;color:var(--muted)}
.diff{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14px}
.diff ins{background:var(--ins);text-decoration:none} .diff del{background:var(--del)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav{flex-direction:row;overflow-x:auto;margin-top:12px}
  nav button{white-space:nowrap}
  .side-note{display:none}
  main{padding:24px 16px 60px}
  .grid2,.flow{grid-template-columns:1fr}
  .flow button{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">미리봄<span>참여 장벽 사전 점검</span></div>
    <nav id="nav"></nav>
    <p class="side-note">작업 내용은 이 브라우저에만 저장돼요. 다른 컴퓨터에서 이어 하려면 ‘실험 개요’에서 백업 파일을 내보내 불러오세요.</p>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden onchange="A.importFile(this)">

<script>
const KEY = 'miribom-v1';
const METHODS = { human: '사람 점검', general: '일반 AI 요청', explicit: '조건 명시 AI 요청' };
const METHOD_KEYS = ['human', 'general', 'explicit'];
const DEFAULT_CONDS = [
  { id: 'move', name: '이동', desc: '프로그램 장소까지 오가는 수단과 거리, 동행이 필요한지' },
  { id: 'time', name: '시간', desc: '운영 요일·시간대가 대상자의 생활 리듬(식사, 돌봄, 일, 병원 등)과 맞는지' },
  { id: 'lit',  name: '문해', desc: '안내문·신청서·활동 자료를 대상자가 읽고 이해할 수 있는지' },
  { id: 'cost', name: '비용', desc: '본인부담금, 재료비, 교통비 등 대상자가 부담하는 비용' }
];
const JUDGE = ['적중', '오탐', '보류'];
const VIEWS = [
  ['home', '실험 개요', ''], ['plans', '계획서 관리', '1'], ['run', '점검 실행', '2'],
  ['judge', '판단 기록지', '3'], ['summary', '요약 비교', '4'], ['revision', '수정 전후 비교', '5']
];

let S;
const A = {};
let keep = new Set(); // 이번에 판정한 지적은 '미판정만' 보기에서도 잠시 남겨 둠

function def() {
  return {
    v: 1, conds: JSON.parse(JSON.stringify(DEFAULT_CONDS)), plans: [], runs: [], findings: [], revisions: {},
    ui: { view: 'home', planId: null, method: 'human', blind: true, jPlan: 'all', jShow: 'todo', revPlan: null, editPlan: null, lastJudge: '' }
  };
}
function load() {
  S = def();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); const base = def(); S = Object.assign(base, d); S.ui = Object.assign(def().ui, d.ui || {}); }
  } catch (e) { /* storage unavailable: start empty */ }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('브라우저 저장에 실패했어요. 백업 파일을 내보내 두세요.'); }
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const nowStamp = () => new Date().toLocaleString('ko-KR');
const $ = id => document.getElementById(id);
const val = id => ($(id) ? $(id).value.trim() : '');
const plan = id => S.plans.find(p => p.id === id);
const runOf = (pid, m) => S.runs.find(r => r.planId === pid && r.method === m);
const fOfRun = rid => S.findings.filter(f => f.runId === rid);
const condName = id => id === 'etc' ? '기타' : (S.conds.find(c => c.id === id) || {}).name || '미분류';
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const fCode = f => 'F-' + hash(f.id).toString(36).toUpperCase().slice(0, 4);
const planLabel = p => p ? `${p.practice ? '연습' : '계획서 ' + p.code}${p.title ? ' · ' + p.title : ''}` : '(삭제된 계획서)';
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ---------- prompts ---------- */
function buildPrompt(p, method) {
  const head = '다음은 실행 전의 사회복지 프로그램 계획서입니다. 이 프로그램을 실행했을 때 대상자의 참여를 가로막을 수 있는 지점을 찾아 지적해 주세요.';
  const conds = method === 'explicit'
    ? '\n\n다음 네 가지 참여조건에 비추어 검토해 주세요.\n' + S.conds.map(c => `- ${c.name}: ${c.desc}`).join('\n') + '\n각 지적에는 해당하는 참여조건을 표시해 주세요.'
    : '';
  const rules = '\n\n지켜 주세요.\n- 계획서에 적혀 있지 않은 내용은 사실처럼 단정하지 마세요. 정보가 없으면 "계획서에 정보 없음"이라고 쓰세요.\n- 각 지적마다 근거가 된 계획서 문장을 그대로 인용해 주세요.\n- 지적은 번호를 붙여 하나씩 나누어 써 주세요.';
  const fmt = method === 'explicit' ? '\n\n형식\n1. 지적:\n   근거(계획서 인용):\n   참여조건:' : '\n\n형식\n1. 지적:\n   근거(계획서 인용):';
  const body = `\n\n[계획서]\n대상: ${p.target || '(적혀 있지 않음)'}\n제목: ${p.title || ''}\n\n${p.text}`;
  return head + conds + rules + fmt + body;
}

/* ---------- navigation ---------- */
A.go = v => { keep.clear(); S.ui.view = v; save(); render(); window.scrollTo(0, 0); };

function render() {
  $('nav').innerHTML = VIEWS.map(([k, t, n]) =>
    `<button class="${S.ui.view === k ? 'on' : ''}" onclick="A.go('${k}')"><span class="n">${n || '·'}</span>${t}</button>`).join('');
  const f = { home: vHome, plans: vPlans, run: vRun, judge: vJudge, summary: vSummary, revision: vRevision }[S.ui.view] || vHome;
  $('main').innerHTML = f();
}

/* ---------- 0. 실험 개요 ---------- */
function vHome() {
  const main = S.plans.filter(p => !p.practice);
  const doneRuns = S.runs.filter(r => main.some(p => p.id === r.planId)).length;
  const judged = S.findings.filter(f => f.judgment).length;
  const grid = main.length ? `<div class="tw"><table><tr><th>계획서</th>${METHOD_KEYS.map(m => `<th class="c">${METHODS[m]}</th>`).join('')}<th class="c">기준본</th></tr>
    ${main.map(p => `<tr><td>${esc(planLabel(p))}</td>${METHOD_KEYS.map(m => { const r = runOf(p.id, m); return `<td class="c">${r ? `<span class="ok">완료</span><span class="small muted"> ${esc(r.date)}</span>` : '<span class="muted">—</span>'}</td>`; }).join('')}
    <td class="c">${p.lockedAt ? '<span class="ok">고정</span>' : '<span class="muted">작성 중</span>'}</td></tr>`).join('')}</table></div>`
    : `<div class="empty">아직 계획서가 없어요. <button class="btn pri" onclick="A.go('plans')">계획서 넣기</button></div>`;
  return `
  <h1>미리봄</h1>
  <p class="lede">프로그램을 시작하기 전에, 대상자의 참여를 막을 수 있는 지점을 미리 봅니다. 지적은 AI가 할 수 있지만, 맞는지와 반영할지는 사람이 정합니다.</p>
  <div class="flow">
    <button onclick="A.go('plans')"><div class="k">1</div><strong>계획서 넣기</strong><span>계획서를 입력하고 기준본으로 고정해요.</span></button>
    <button onclick="A.go('run')"><div class="k">2</div><strong>지적과 근거 확인</strong><span>사람이 먼저 점검하고, AI 답변을 지적 단위로 나눠 적어요.</span></button>
    <button onclick="A.go('judge')"><div class="k">3</div><strong>채택·보류 판단</strong><span>지적마다 적중·오탐·보류를 판정하고 반영 여부를 정해요.</span></button>
  </div>

  <h2>실험 진행 현황</h2>
  <p class="small muted">본실험 점검 ${doneRuns} / ${main.length * 3 || 9}회 · 지적 ${S.findings.length}건 중 판정 ${judged}건 (연습용 계획서는 현황과 비교에서 빠져요)</p>
  ${grid}

  <h2>자료 관리</h2>
  <div class="panel">
    <div class="row">
      <button class="btn pri" onclick="A.exportBackup()">백업 파일 내보내기</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">백업 파일 불러오기</button>
      <button class="btn" onclick="A.exportCSV('findings')">지적 기록 CSV</button>
      <button class="btn" onclick="A.exportCSV('runs')">점검 기록 CSV</button>
    </div>
    <p class="small muted" style="margin:12px 0 0">CSV는 엑셀에서 바로 열려요. 백업 파일(.json)은 다른 컴퓨터에서 ‘불러오기’로 이어서 작업할 때 써요.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="row">
      <button class="btn" onclick="A.addSample()">연습용 예시 계획서 넣기</button>
      <button class="btn warn" onclick="A.resetAll()">모든 자료 지우기</button>
    </div>
  </div>
  <p class="small muted">미리봄은 판단을 돕는 도구예요. 지적의 타당성과 계획서 수정의 최종 판단과 책임은 사용자에게 있어요.</p>`;
}

/* ---------- 1. 계획서 관리 ---------- */
function vPlans() {
  const anyRun = S.runs.length > 0;
  const ed = S.ui.editPlan;
  const p = ed && ed !== 'new' ? plan(ed) : null;
  const form = ed ? `
    <div class="panel">
      <h3>${ed === 'new' ? '새 계획서' : '계획서 수정'}</h3>
      <div class="grid2">
        <div><label class="f" for="pf-code">구분 (A, B, C …)</label><input type="text" id="pf-code" value="${esc(p ? p.code : '')}" placeholder="A"></div>
        <div><label class="f" for="pf-target">대상</label><input type="text" id="pf-target" value="${esc(p ? p.target : '')}" placeholder="예: 재가 독거 어르신 15명"></div>
      </div>
      <label class="f" for="pf-title">프로그램 제목</label><input type="text" id="pf-title" value="${esc(p ? p.title : '')}">
      <label class="f" for="pf-text">계획서 본문</label>
      <textarea id="pf-text" class="tall" placeholder="목적, 회기 구성, 운영 장소와 시간, 모집 방법, 비용 등을 그대로 붙여 넣으세요.">${esc(p ? p.text : '')}</textarea>
      <label class="row small" style="margin-top:10px"><input type="checkbox" id="pf-practice" ${p && p.practice ? 'checked' : ''}> 연습용 계획서 (예비 실행에만 쓰고 비교에서 뺌)</label>
      <div class="row" style="margin-top:16px"><button class="btn pri" onclick="A.savePlan()">저장</button><button class="btn" onclick="A.editPlan(null)">취소</button></div>
    </div>` : `<button class="btn pri" onclick="A.editPlan('new')">새 계획서 추가</button>`;

  const list = S.plans.length ? S.plans.map(p => {
    const runs = S.runs.filter(r => r.planId === p.id).length;
    return `<div class="panel">
      <div class="row" style="justify-content:space-between">
        <div><strong>${esc(planLabel(p))}</strong> ${p.practice ? '<span class="tag">연습용</span>' : ''}
          ${p.lockedAt ? `<span class="tag brand">기준본 고정 ${esc(p.lockedAt)}</span>` : '<span class="tag">작성 중</span>'}
          <div class="small muted">대상: ${esc(p.target || '—')} · 점검 ${runs}회</div></div>
        <div class="row">
          ${p.lockedAt ? '' : `<button class="btn sm" onclick="A.editPlan('${p.id}')">수정</button><button class="btn sm pri" onclick="A.lockPlan('${p.id}')">기준본 고정</button>`}
          ${runs ? '' : `<button class="btn sm warn" onclick="A.delPlan('${p.id}')">삭제</button>`}
        </div>
      </div>
      <details style="margin-top:10px"><summary>본문 보기</summary><pre class="doc" style="margin-top:8px">${esc(p.text)}</pre></details>
    </div>`;
  }).join('') : '';

  return `
  <h1>계획서 관리</h1>
  <p class="lede">점검할 계획서를 넣고, 점검을 시작하기 전에 기준본으로 고정해요. 고정한 뒤에는 본문을 바꿀 수 없어서 모든 방식이 같은 글을 점검하게 돼요.</p>
  ${form}
  <div style="margin-top:16px">${list}</div>

  <h2>참여조건 4종</h2>
  <p class="small muted">‘조건 명시 AI 요청’에 그대로 들어가는 설명이에요. ${anyRun ? '점검이 시작되어 더 이상 바꿀 수 없어요.' : '첫 점검을 저장하면 고정돼요.'}</p>
  <div class="panel">
    ${S.conds.map((c, i) => `<div class="grid2" style="grid-template-columns:120px 1fr;margin-bottom:8px">
      <input type="text" value="${esc(c.name)}" ${anyRun ? 'disabled' : ''} onchange="A.setCond(${i},'name',this.value)" aria-label="조건 이름">
      <input type="text" value="${esc(c.desc)}" ${anyRun ? 'disabled' : ''} onchange="A.setCond(${i},'desc',this.value)" aria-label="조건 설명"></div>`).join('')}
  </div>`;
}
A.editPlan = id => { S.ui.editPlan = id; save(); render(); };
A.savePlan = () => {
  const text = val('pf-text');
  if (!text) return toast('계획서 본문을 넣어 주세요.');
  const data = { code: val('pf-code') || '?', title: val('pf-title'), target: val('pf-target'), text, practice: $('pf-practice').checked };
  if (S.ui.editPlan === 'new') S.plans.push(Object.assign({ id: uid(), lockedAt: null, aiOrder: null, created: nowStamp() }, data));
  else Object.assign(plan(S.ui.editPlan), data);
  S.ui.editPlan = null; commit('계획서를 저장했어요.');
};
A.lockPlan = id => {
  if (!confirm('기준본으로 고정하면 본문을 더 이상 고칠 수 없어요. 고정할까요?')) return;
  plan(id).lockedAt = today(); commit('기준본으로 고정했어요.');
};
A.delPlan = id => { if (!confirm('이 계획서를 지울까요?')) return; S.plans = S.plans.filter(p => p.id !== id); commit('지웠어요.'); };
A.setCond = (i, k, v) => { S.conds[i][k] = v.trim(); save(); };

/* ---------- 2. 점검 실행 ---------- */
function vRun() {
  const locked = S.plans.filter(p => p.lockedAt);
  if (!locked.length) return `<h1>점검 실행</h1><div class="empty">기준본으로 고정한 계획서가 있어야 점검을 시작할 수 있어요.<br><br><button class="btn pri" onclick="A.go('plans')">계획서 관리로 가기</button></div>`;
  if (!locked.some(p => p.id === S.ui.planId)) S.ui.planId = locked[0].id;
  const p = plan(S.ui.planId);
  const m = S.ui.method;
  const human = runOf(p.id, 'human');
  const aiBlocked = m !== 'human' && !human && !p.practice;

  const order = p.aiOrder
    ? `<span class="small">AI 실행 순서: ${p.aiOrder.map((k, i) => `${i + 1}) ${METHODS[k]}`).join('  ')}</span>`
    : `<button class="btn sm" onclick="A.randomOrder('${p.id}')">AI 두 방식의 실행 순서를 무작위로 정하기</button>`;

  let body = '';
  const r = runOf(p.id, m);
  if (aiBlocked) {
    body = `<div class="notice">사람 점검을 먼저 기록해야 AI 점검을 시작할 수 있어요. AI 답을 먼저 보면 사람 점검이 그 답에 끌려가기 쉬워서예요.</div>`;
  } else if (m === 'human') {
    body = `<details ${r ? '' : 'open'}><summary>점검할 계획서 본문</summary><pre class="doc" style="margin-top:8px">${esc(p.text)}</pre></details>` +
      (r ? runInfo(r) : `<div class="panel" style="margin-top:12px"><div class="grid2">
        <div><label class="f" for="rn-who">점검자</label><input type="text" id="rn-who" placeholder="이름"></div>
        <div><label class="f" for="rn-date">점검일</label><input type="date" id="rn-date" value="${today()}"></div></div>
        <div class="row" style="margin-top:14px"><button class="btn pri" onclick="A.startRun()">사람 점검 기록 시작</button></div></div>`);
  } else {
    const prompt = r ? r.prompt : buildPrompt(p, m);
    body = `<label class="f">요청문 (복사해서 ${r ? '사용했던' : '새 대화에 붙여 넣으세요'})</label>
      <textarea id="rn-prompt" class="tall" readonly>${esc(prompt)}</textarea>
      <div class="row" style="margin:8px 0 0"><button class="btn sm" onclick="A.copy('rn-prompt')">요청문 복사</button>
      <span class="small muted">두 AI 방식은 같은 모델의 새 대화에서 실행해요.</span></div>` +
      (r ? runInfo(r) : `<div class="panel" style="margin-top:16px"><div class="grid2">
        <div><label class="f" for="rn-model">모델명</label><input type="text" id="rn-model" value="${esc(S.ui.lastModel || '')}" placeholder="예: GPT-5, Claude Sonnet 5.5"></div>
        <div><label class="f" for="rn-date">실행일</label><input type="date" id="rn-date" value="${today()}"></div></div>
        <label class="f" for="rn-resp">답변 원문 (고치지 말고 그대로 붙여 넣기)</label>
        <textarea id="rn-resp" class="tall"></textarea>
        <div class="row" style="margin-top:14px"><button class="btn pri" onclick="A.startRun()">답변 원문 저장</button></div></div>`);
  }

  return `
  <h1>점검 실행</h1>
  <p class="lede">계획서마다 사람 점검을 먼저 하고, AI 두 방식을 정해진 순서로 실행해요. 답변은 지적 하나씩 나눠 기록해요.</p>
  <div class="row"><label class="f" for="rn-plan" style="margin:0">계획서</label>
    <select id="rn-plan" style="max-width:360px" onchange="A.pickPlan(this.value)">${locked.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>${esc(planLabel(x))}</option>`).join('')}</select>
    ${order}</div>
  <div class="tabs">${METHOD_KEYS.map(k => { const done = runOf(p.id, k); const dis = k !== 'human' && !human && !p.practice;
    return `<button class="${k === m ? 'on' : ''}" ${dis ? 'disabled' : ''} onclick="A.pickMethod('${k}')">${METHODS[k]}${done ? ' ✓' : ''}</button>`; }).join('')}</div>
  ${body}
  ${r ? findingEditor(r) : ''}`;
}
function runInfo(r) {
  return `<div class="panel" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><div class="small">
      ${r.method === 'human' ? `점검자 <strong>${esc(r.who)}</strong>` : `모델 <strong>${esc(r.model)}</strong>`} · ${esc(r.date)} 실행 · 기록 ${esc(r.created)}</div>
      <button class="btn sm warn" onclick="A.delRun('${r.id}')">이 점검 기록 지우기</button></div>
    ${r.method !== 'human' ? `<details style="margin-top:10px" open><summary>답변 원문</summary><pre class="doc" style="margin-top:8px">${esc(r.response)}</pre></details>` : ''}
  </div>`;
}
function findingEditor(r) {
  const list = fOfRun(r.id);
  return `<h2>지적 기록 (${list.length}건)</h2>
  ${list.map(f => `<div class="finding"><div class="row" style="justify-content:space-between">
      <div class="row"><span class="tag brand">${esc(condName(f.cond))}</span><span class="small muted">${fCode(f)}</span>${f.judgment ? `<span class="tag">${f.judgment}</span>` : ''}</div>
      ${f.judgment ? '' : `<button class="btn sm warn" onclick="A.delFinding('${f.id}')">지우기</button>`}</div>
    <div style="margin-top:6px">${esc(f.text)}</div>${f.evidence ? `<div class="q">${esc(f.evidence)}</div>` : ''}</div>`).join('')}
  <div class="panel">
    <h3>지적 추가</h3>
    <label class="f" for="fd-cond">참여조건</label>
    <select id="fd-cond">${S.conds.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="etc">기타 (네 조건에 해당 없음)</option></select>
    <label class="f" for="fd-text">지적 내용</label><textarea id="fd-text" style="min-height:70px"></textarea>
    <label class="f" for="fd-ev">근거 (계획서 인용)</label><textarea id="fd-ev" style="min-height:60px"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="A.addFinding('${r.id}')">지적 추가</button>
    <span class="small muted">${r.method === 'general' ? '일반 요청 답변은 조건이 표시되지 않으니, 기록하는 사람이 가장 가까운 조건을 골라요.' : '답변에 지적이 여러 개면 하나씩 나눠 넣어요.'}</span></div>
  </div>`;
}
A.pickPlan = id => { S.ui.planId = id; S.ui.method = 'human'; save(); render(); };
A.pickMethod = m => { S.ui.method = m; save(); render(); };
A.randomOrder = id => { const o = ['general', 'explicit']; if (Math.random() < .5) o.reverse(); plan(id).aiOrder = o; commit('실행 순서를 정했어요.'); };
A.startRun = () => {
  const p = plan(S.ui.planId), m = S.ui.method;
  if (runOf(p.id, m)) return;
  const r = { id: uid(), planId: p.id, method: m, date: val('rn-date') || today(), created: nowStamp() };
  if (m === 'human') { r.who = val('rn-who'); if (!r.who) return toast('점검자 이름을 적어 주세요.'); }
  else {
    r.model = val('rn-model'); r.response = $('rn-resp').value; r.prompt = buildPrompt(p, m);
    if (!r.model) return toast('모델명을 적어 주세요. 버전까지 적으면 좋아요.');
    if (!r.response.trim()) return toast('답변 원문을 붙여 넣어 주세요.');
    S.ui.lastModel = r.model;
  }
  S.runs.push(r); commit('점검 기록을 저장했어요.');
};
A.delRun = id => {
  const n = fOfRun(id).length;
  if (!confirm(`이 점검 기록${n ? '과 지적 ' + n + '건' : ''}을 지울까요? 되돌릴 수 없어요.`)) return;
  S.runs = S.runs.filter(r => r.id !== id); S.findings = S.findings.filter(f => f.runId !== id); commit('지웠어요.');
};
A.addFinding = rid => {
  const text = val('fd-text'); if (!text) return toast('지적 내용을 적어 주세요.');
  const r = S.runs.find(x => x.id === rid);
  S.findings.push({ id: uid(), runId: rid, planId: r.planId, method: r.method, cond: val('fd-cond'), text, evidence: val('fd-ev'),
    judgment: '', judge: '', reason: '', humanMissed: false, adopt: '', adoptReason: '' });
  commit('지적을 추가했어요.');
};
A.delFinding = id => { S.findings = S.findings.filter(f => f.id !== id); commit(); };
A.copy = id => {
  const el = $(id);
  const done = () => toast('복사했어요.');
  if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(done, () => { el.select(); document.execCommand('copy'); done(); });
  else { el.select(); document.execCommand('copy'); done(); }
};

/* ---------- 3. 판단 기록지 ---------- */
function vJudge() {
  const blind = S.ui.blind;
  let list = S.findings.slice();
  if (S.ui.jPlan !== 'all') list = list.filter(f => f.planId === S.ui.jPlan);
  if (S.ui.jShow === 'todo') list = list.filter(f => !f.judgment || keep.has(f.id));
  list.sort(blind ? (a, b) => hash(a.id) - hash(b.id)
    : (a, b) => (a.planId + METHOD_KEYS.indexOf(a.method)).localeCompare(b.planId + METHOD_KEYS.indexOf(b.method)));

  const items = list.length ? list.map(f => {
    const p = plan(f.planId), r = S.runs.find(x => x.id === f.runId) || {};
    return `<div class="finding j-${f.judgment}">
      <div class="row" style="justify-content:space-between"><div class="row">
        <strong>${fCode(f)}</strong><span class="tag brand">${esc(condName(f.cond))}</span><span class="small muted">${esc(planLabel(p))}</span>
        ${blind ? '' : `<span class="tag">${METHODS[f.method]}${r.model ? ' · ' + esc(r.model) : ''}</span>`}</div></div>
      <div style="margin-top:8px">${esc(f.text)}</div>${f.evidence ? `<div class="q">${esc(f.evidence)}</div>` : ''}
      <div class="row" style="margin-top:10px">
        <div class="seg" role="group" aria-label="판정">${JUDGE.map(j => `<button class="${j} ${f.judgment === j ? 'on' : ''}" onclick="A.judge('${f.id}','${j}')">${j}</button>`).join('')}</div>
        <input type="text" style="max-width:140px" placeholder="판정자" value="${esc(f.judge)}" onchange="A.setF('${f.id}','judge',this.value)" aria-label="판정자">
        <input type="text" style="flex:1;min-width:200px" placeholder="판정 근거" value="${esc(f.reason)}" onchange="A.setF('${f.id}','reason',this.value)" aria-label="판정 근거">
      </div>
      ${blind ? '' : `<div class="row" style="margin-top:10px">
        <select style="max-width:150px" onchange="A.setF('${f.id}','adopt',this.value,true)" aria-label="반영 여부">
          ${[['', '반영 여부 미정'], ['반영', '반영'], ['보류', '보류'], ['제외', '제외']].map(([v, t]) => `<option value="${v}" ${f.adopt === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <input type="text" style="flex:1;min-width:200px" placeholder="반영·보류·제외 이유 (기관 사정 등)" value="${esc(f.adoptReason)}" onchange="A.setF('${f.id}','adoptReason',this.value)" aria-label="반영 이유">
        ${f.method !== 'human' && f.judgment === '적중' ? `<label class="row small"><input type="checkbox" ${f.humanMissed ? 'checked' : ''} onchange="A.setF('${f.id}','humanMissed',this.checked,true)"> 사람 점검에 없던 장벽</label>` : ''}
      </div>`}
    </div>`;
  }).join('') : `<div class="empty">${S.ui.jShow === 'todo' ? '판정할 지적이 없어요.' : '아직 기록된 지적이 없어요.'}</div>`;

  return `
  <h1>판단 기록지</h1>
  <p class="lede">지적마다 맞는 지적인지(적중·오탐·보류)를 먼저 판정하고, 계획서에 반영할지는 따로 정해요. 맞는 지적이라도 기관 사정으로 반영하지 않을 수 있어요.</p>
  <div class="panel row">
    <select style="max-width:260px" onchange="A.setUI('jPlan',this.value)" aria-label="계획서">
      <option value="all">모든 계획서</option>${S.plans.map(p => `<option value="${p.id}" ${S.ui.jPlan === p.id ? 'selected' : ''}>${esc(planLabel(p))}</option>`).join('')}</select>
    <select style="max-width:160px" onchange="A.setUI('jShow',this.value)" aria-label="보기">
      <option value="todo" ${S.ui.jShow === 'todo' ? 'selected' : ''}>미판정만</option><option value="all" ${S.ui.jShow === 'all' ? 'selected' : ''}>전체</option></select>
    <label class="row small"><input type="checkbox" ${blind ? 'checked' : ''} onchange="A.setUI('blind',this.checked)"> 방식 가리기 (판정자용)</label>
  </div>
  ${blind ? '<div class="notice info">지금은 어느 방식에서 나온 지적인지 보이지 않아요. 판정자에게 이 화면을 보여 주세요. 반영 여부와 ‘사람 점검에 없던 장벽’ 표시는 가리기를 끄면 나타나요.</div>' : ''}
  ${items}`;
}
A.setUI = (k, v) => { keep.clear(); S.ui[k] = v; save(); render(); };
A.judge = (id, j) => {
  const f = S.findings.find(x => x.id === id);
  keep.add(id);
  f.judgment = f.judgment === j ? '' : j;
  if (f.judgment && !f.judge && S.ui.lastJudge) f.judge = S.ui.lastJudge;
  if (f.judgment !== '적중') f.humanMissed = false;
  commit();
};
A.setF = (id, k, v, rerender) => {
  const f = S.findings.find(x => x.id === id); f[k] = typeof v === 'string' ? v.trim() : v;
  if (k === 'judge' && v) S.ui.lastJudge = v.trim();
  save(); if (rerender) render();
};

/* ---------- 4. 요약 비교 ---------- */
function vSummary() {
  const mainIds = new Set(S.plans.filter(p => !p.practice).map(p => p.id));
  const fs = S.findings.filter(f => mainIds.has(f.planId));
  const cols = [...S.conds.map(c => [c.id, c.name]), ['etc', '기타'], ['*', '전체']];
  const cell = (m, c) => {
    const x = fs.filter(f => f.method === m && (c === '*' || f.cond === c));
    const h = x.filter(f => f.judgment === '적중').length, o = x.filter(f => f.judgment === '오탐').length;
    const b = x.filter(f => f.judgment === '보류').length, u = x.filter(f => !f.judgment).length;
    const main = h + o ? `<b>${h}/${h + o}</b> <span class="muted">(${Math.round(h / (h + o) * 100)}%)</span>` : `<span class="muted">계산 불가</span>`;
    return `<td class="c cell">${main}<span class="sub">보류 ${b}${u ? ' · 미판정 ' + u : ''}</span></td>`;
  };
  const runsDone = S.runs.filter(r => mainIds.has(r.planId)).length;
  const missed = m => fs.filter(f => f.method === m && f.humanMissed && f.judgment === '적중').length;
  const unj = fs.filter(f => !f.judgment).length;

  return `
  <h1>요약 비교</h1>
  <p class="lede">방식별·참여조건별 타당 비율이에요. 지적이 많은 방식이 아니라, 맞는 지적의 비율이 높은 방식을 봐요.</p>
  <p class="small muted">본실험 점검 ${runsDone}회 · 지적 ${fs.length}건${unj ? ` · <strong>미판정 ${unj}건이 남아 있어 결과가 바뀔 수 있어요</strong>` : ''}</p>
  <div class="tw"><table>
    <tr><th>방식</th>${cols.map(([, n]) => `<th class="c">${esc(n)}</th>`).join('')}</tr>
    ${METHOD_KEYS.map(m => `<tr><td><strong>${METHODS[m]}</strong></td>${cols.map(([c]) => cell(m, c)).join('')}</tr>`).join('')}
  </table></div>
  <div class="panel" style="margin-top:16px">
    <h3>사람 점검에 없던 장벽을 AI가 찾은 경우 (적중)</h3>
    <p style="margin:0">일반 AI 요청 <strong>${missed('general')}건</strong> · 조건 명시 AI 요청 <strong>${missed('explicit')}건</strong></p>
    <p class="small muted" style="margin:6px 0 0">판단 기록지에서 ‘방식 가리기’를 끄고 표시한 지적만 세요.</p>
  </div>
  <div class="notice info">타당 비율 = 적중 ÷ (적중 + 오탐). 보류는 따로 세고, 판정된 지적이 없는 칸은 ‘계산 불가’로 둬요. 칸마다 지적 수가 적으므로 비율보다 건수를 함께 보고, 이 결과를 다른 계획서나 현장 전체로 일반화하지 않아요. 연습용 계획서는 빠져 있어요.</div>`;
}

/* ---------- 5. 수정 전후 비교 ---------- */
function vRevision() {
  const locked = S.plans.filter(p => p.lockedAt);
  if (!locked.length) return `<h1>수정 전후 비교</h1><div class="empty">기준본으로 고정한 계획서가 있어야 해요.</div>`;
  if (!locked.some(p => p.id === S.ui.revPlan)) S.ui.revPlan = locked[0].id;
  const p = plan(S.ui.revPlan);
  const rv = S.revisions[p.id] || { after: p.text, note: '', updated: '' };
  const related = S.findings.filter(f => f.planId === p.id && f.judgment === '적중');
  return `
  <h1>수정 전후 비교</h1>
  <p class="lede">판정과 반영 판단을 거친 지적으로 계획서를 고치고, 무엇이 바뀌었는지 남겨요. 기준본은 그대로 두고 수정본을 따로 저장해요.</p>
  <select style="max-width:360px" onchange="A.setUI('revPlan',this.value)" aria-label="계획서">${locked.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>${esc(planLabel(x))}</option>`).join('')}</select>

  <h2>적중으로 판정된 지적 (${related.length}건)</h2>
  ${related.length ? `<div class="tw"><table><tr><th>지적</th><th>조건</th><th>방식</th><th>반영 여부</th><th>이유</th></tr>
    ${related.map(f => `<tr><td>${esc(f.text)}</td><td>${esc(condName(f.cond))}</td><td class="small">${METHODS[f.method]}</td><td>${esc(f.adopt || '미정')}</td><td class="small">${esc(f.adoptReason)}</td></tr>`).join('')}</table></div>`
    : '<p class="muted small">아직 적중으로 판정된 지적이 없어요.</p>'}

  <h2>본문</h2>
  <div class="grid2">
    <div><label class="f">기준본 (${esc(p.lockedAt)} 고정)</label><pre class="doc" style="max-height:none;min-height:260px">${esc(p.text)}</pre></div>
    <div><label class="f" for="rv-after">수정본</label><textarea id="rv-after" class="tall" style="min-height:260px">${esc(rv.after)}</textarea></div>
  </div>
  <label class="f" for="rv-note">판단 과정 (무엇을 왜 고쳤고, 무엇을 왜 고치지 않았는지)</label>
  <textarea id="rv-note">${esc(rv.note)}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn pri" onclick="A.saveRev()">수정본 저장</button>
    ${rv.updated ? `<span class="small muted">마지막 저장 ${esc(rv.updated)}</span>` : ''}</div>

  <h2>바뀐 부분</h2>
  <p class="small muted"><ins style="background:var(--ins);text-decoration:none">추가된 말</ins> · <del style="background:var(--del)">지운 말</del></p>
  <div class="diff">${diffHTML(p.text, rv.after)}</div>`;
}
A.saveRev = () => { S.revisions[S.ui.revPlan] = { after: $('rv-after').value, note: $('rv-note').value, updated: nowStamp() }; commit('수정본을 저장했어요.'); };

function diffHTML(a, b) {
  const split = s => s.split(/(\s+)/).filter(x => x !== '');
  let x = split(a), y = split(b);
  if (x.length * y.length > 3e6) { x = a.split(/(\n)/); y = b.split(/(\n)/); }
  const n = x.length, m = y.length, W = m + 1;
  const L = new Uint32Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i * W + j] = x[i] === y[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  let i = 0, j = 0, out = '';
  while (i < n && j < m) {
    if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
    else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) { out += `<del>${esc(x[i++])}</del>`; }
    else { out += `<ins>${esc(y[j++])}</ins>`; }
  }
  while (i < n) out += `<del>${esc(x[i++])}</del>`;
  while (j < m) out += `<ins>${esc(y[j++])}</ins>`;
  return out || '<span class="muted">바뀐 부분이 없어요.</span>';
}

/* ---------- 자료 관리 ---------- */
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
A.exportBackup = () => { download(`miribom-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast('백업 파일을 내보냈어요.'); };
A.importFile = input => {
  const file = input.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.plans) || !Array.isArray(d.findings)) throw new Error();
      if (!confirm('지금 브라우저의 자료를 백업 파일의 자료로 바꿀까요?')) return;
      const base = def(); S = Object.assign(base, d); S.ui = Object.assign(def().ui, d.ui || {});
      commit('백업 파일을 불러왔어요.');
    } catch (e) { toast('미리봄 백업 파일이 아니에요. 내보낸 .json 파일을 골라 주세요.'); }
    input.value = '';
  };
  rd.readAsText(file);
};
A.exportCSV = kind => {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  let rows;
  if (kind === 'findings') {
    rows = [['지적ID', '계획서', '연습용', '방식', '모델', '실행일', '참여조건', '지적', '근거', '판정', '판정자', '판정근거', '사람점검에없던장벽', '반영여부', '반영이유']];
    S.findings.forEach(f => { const p = plan(f.planId), r = S.runs.find(x => x.id === f.runId) || {};
      rows.push([fCode(f), planLabel(p), p && p.practice ? 'Y' : '', METHODS[f.method], r.model || r.who || '', r.date || '', condName(f.cond), f.text, f.evidence, f.judgment, f.judge, f.reason, f.humanMissed ? 'Y' : '', f.adopt, f.adoptReason]); });
  } else {
    rows = [['계획서', '연습용', '방식', '점검자/모델', '실행일', '기록시각', '지적수', '요청문', '답변원문']];
    S.runs.forEach(r => { const p = plan(r.planId);
      rows.push([planLabel(p), p && p.practice ? 'Y' : '', METHODS[r.method], r.who || r.model, r.date, r.created, fOfRun(r.id).length, r.prompt || '', r.response || '']); });
  }
  download(`miribom-${kind === 'findings' ? '지적기록' : '점검기록'}-${today()}.csv`, '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
};
A.addSample = () => {
  S.plans.push({ id: uid(), code: '연습', practice: true, lockedAt: null, aiOrder: null, created: nowStamp(),
    title: '어르신 스마트폰 기초 교실', target: '농촌 지역 재가 독거 어르신 12명',
    text: '1. 목적: 스마트폰 사용 능력을 높여 가족·이웃과의 연락과 정보 접근을 돕는다.\n2. 기간 및 회기: 10월 매주 화요일 오전 9시~11시, 총 4회.\n3. 장소: 읍내 복지관 3층 교육실(엘리베이터 없음).\n4. 내용: 1회 전화·문자, 2회 카카오톡, 3회 사진 보내기, 4회 키오스크 사용.\n5. 모집: 복지관 홈페이지 공지와 안내문 배포. 신청은 온라인 신청서로 받는다.\n6. 비용: 교재비 1만 원 본인 부담. 개인 스마트폰 지참.\n7. 기대효과: 참여자의 80% 이상이 단체 대화방에 사진을 보낼 수 있다.' });
  commit('연습용 예시 계획서를 넣었어요. 계획서 관리에서 확인하세요.');
};
A.resetAll = () => {
  if (!confirm('모든 계획서와 점검·판정 기록을 지울까요? 먼저 백업 파일을 내보내 두는 것을 권해요.')) return;
  if (!confirm('정말 지울까요? 되돌릴 수 없어요.')) return;
  S = def(); commit('모든 자료를 지웠어요.');
};

load(); render();
</script>
